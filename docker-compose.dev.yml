services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    environment:
      ## Set the MySQL main user to be stemmaweb; 
      ## user stemweb and its DB will be set up
      ## in the relevant initdb script.
      - MARIADB_USER=stemweb
      - MARIADB_PASSWORD=StemWeb-DevPassWord
      - MARIADB_DATABASE=stemwebdb_v1
      - MARIADB_RANDOM_ROOT_PASSWORD=yes
    volumes:
      ## Creates the stexaminer database and grants the stemweb user access
      ## (only runs when the DB is first initialised)
      - ./dev/mariadb/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    
  redis:
    image: redis:alpine
    container_name: redis
    sysctls:
      net.core.somaxconn: 512     # maximal number of connections
    command:
        redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./dev/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - backend

  stemweb-py37:
    image: dhuniwien/stemweb_py37:latest
    container_name: stemweb
    environment:
      - STEMWEB_DBHOST=mariadb
      - STEMWEB_DBPASS=StemWeb-DevPassWord
      - STEMWEB_DBENGINE=mysql
    volumes:
      - ./dev/stemweb/local_settings.py:/home/stemweb/Stemweb/local_settings.py
    depends_on:
      - mariadb
      - redis
    networks:
      - backend

  stexaminer:
    image: dhuniwien/stexaminer
    ## The idp solver binaries inside the image are x86-64 only, so the image
    ## has to be built (docker build --platform linux/amd64) and run as amd64
    platform: linux/amd64
    container_name: stexaminer
    environment:
      - STEX_DEBUG=true
      - STEX_SECRET_KEY=stexaminer-dev-secret-key
      ## Celery broker / result store; use redis DB 1 to stay clear of stemweb
      - STEX_REDIS=redis://redis:6379/1
      - STEX_DBENGINE=mysql
      - STEX_DBNAME=stexaminer_db
      - STEX_DBUSER=stemweb
      - STEX_DBPASSW=StemWeb-DevPassWord
      - STEX_DBHOST=mariadb
      - STEX_DBPORT=3306
    volumes:
      ## Stopgap fix for the result cache in the stexaminer image, which
      ## returns the wrong number of results (or none) for repeated groupings
      - ./dev/stexaminer/views.py:/home/idp/api_app/views.py:ro
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      - mariadb
      - redis
    networks:
      backend:
        ## Stexaminer's Django settings only accept requests addressed to
        ## the host name "idp" (or localhost)
        aliases:
          - idp

  stemmarest:
    image: "dhuniwien/stemmarest:main"
    container_name: stemmarest
    ports:
      - 127.0.0.1:8080:8080
    networks:
      - backend

  stemmaweb:
    container_name: stemmaweb
    build: 
      context: .
      dockerfile: Dockerfile-dev
    depends_on:
      - stemmarest
    volumes:
      - ./:/var/www/stemmaweb/
    ports:
      - 127.0.0.1:3000:3000
    networks:
      - backend


networks:
  backend:
    driver: bridge
