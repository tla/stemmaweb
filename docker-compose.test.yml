services:
  stemmarest:
    image: "dhuniwien/stemmarest:latest"

  stemweb:
    container_name: stemweb
    build: stemweb_mock
    ports:
      - "8000:8000"

  # Stands in for Google's reCAPTCHA siteverify endpoint (see frontend-e2e/cypress/support)
  recaptcha:
    container_name: recaptcha
    build: recaptcha_mock

  # Stands in for GitHub's OAuth and REST API (see frontend-e2e/cypress/e2e/github-login.cy.js)
  oauthmock:
    container_name: oauthmock
    build: oauth_mock

  stemmaweb:
    container_name: stemmaweb
    build: .
    depends_on:
      - stemmarest
      - stemweb
      - recaptcha
      - oauthmock
    env_file:
      - .env.test
    environment:
      # Takes precedence over .env.test
      RECAPTCHA_VERIFICATION_URL: http://recaptcha:8001/recaptcha/api/siteverify
      # GitHub login runs against the oauthmock service. The OAuth callback and the final
      # redirect need absolute URLs, so tell the middleware where it is served.
      STEMMAWEB_MIDDLEWARE_URL: http://stemmaweb:3000
      STEMMAWEB_FRONTEND_URL: http://stemmaweb:3000/
      GITHUB_AUTHORIZATION_URL: http://oauthmock:8002/login/oauth/authorize
      GITHUB_API_ACCESS_TOKEN_URL: http://oauthmock:8002/login/oauth/access_token
      GITHUB_API_USER_URL: http://oauthmock:8002/user
      GITHUB_API_USER_EMAILS_URL: http://oauthmock:8002/user/emails
    volumes:
      - ./frontend/config/env.js.prod:/usr/src/app/stemmaweb_middleware/stemmaweb/src/js/env.js

  stemmaweb-e2e:
    container_name: stemmaweb-e2e
    build: frontend-e2e
    depends_on:
      - stemmaweb
    env_file:
      - .env.test
    volumes:
      - ./frontend-e2e/:/app
      - ./bin/init-data/stemmarest/:/app/cypress/.initdata4headless
    entrypoint: >
      /bin/bash -c "./wait-for-stack.sh &&
                    npm install &&
                    npm run ${CY_NPM_COMMAND}"
