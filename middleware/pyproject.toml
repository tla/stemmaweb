[tool.poetry]
name = "stemmaweb_middleware"
version = "0.1.0"
description = "Middleware for Stemmaweb handling authentication and passthrough to Stemmarest"
authors = ["Péter Ferenc Gyarmati <dev.petergy@gmail.com>"]
repository = "https://github.com/tla/stemmaweb"
exclude = ["tests/*"]
readme = "README.md"
classifiers = [
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.14",
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
Authlib = "^1.7.0"
email-validator = "^2.3.0"
environs = "^15.0.1"
Flask = "^3.1.0"
Flask-Login = "^0.6.3"
gunicorn = "^25.0.0"
pydantic = "^2.13.0"
requests = "^2.33.0"
Werkzeug = "^3.1.3"
loguru = "^0.7.3"
flask-cors = "^6.0.0"
schedule = "^1.2.2"

[tool.poetry.group.dev.dependencies]
black = "^26.0.0"
flake8 = "^7.2.0"
flake8-black = "^0.4.0"
isort = "^8.0.0"
libcst = "^1.8"  # pinned for the benefit of pytype
mypy = "^1.15.0"
pluggy = "^1.6"  # pinned for the benefit of pytest
pytest = "^9.0.0"
pytype = "^2024.10.11"
types-requests = "^2.33.0"
debugpy = "^1.8.14"

[build-system]
requires = ["poetry-core (>=2.0.0)"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
include = ["stemmaweb_middleware"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 88
